*{box-sizing:border-box;border-radius:0!important}
html,body{margin:0;background:#fff;color:#000;font-family:Arial,"Malgun Gothic",sans-serif}
button,input,textarea,select{font:inherit;color:#000}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #000;outline-offset:2px}
.top{min-height:56px;padding:8px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid #000;background:#fff}
.top strong{font-size:17px}.top small{font-size:12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 770px;min-height:calc(100vh - 56px)}
.panel{background:#fff;min-width:0}.preview-hidden .grid{grid-template-columns:minmax(0,1fr)}.preview-hidden .preview-panel{display:none}.editor{order:1}.preview-panel{order:2;border-left:1px solid #000}
.panel-title{height:55px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #000;font-size:15px;font-weight:700}
.editor-content{max-width:1040px;margin:0 auto;padding:30px 40px 50px}
.field{margin-bottom:26px}.field label{display:block;margin-bottom:10px;font-size:13px;font-weight:700}
.field input[type=text],.field select,.field textarea{display:block;width:100%;padding:12px 14px;border:1px solid #000;background:#fff;outline:none}
.field input[type=text]{font-size:20px;font-weight:700;line-height:1.45}
#bodyText{min-height:calc(100vh - 335px);height:55vh;resize:vertical;font-size:17px;line-height:1.85;font-weight:400}
.field select{font-size:14px;max-width:150px}.help{font-size:12px;line-height:1.5;margin:8px 0 0}.add-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.file-label,.review-button{display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid #000;color:#000;padding:8px 12px;font-size:12px;font-weight:700}
.file-label:hover,.review-button:hover,.review-button[aria-pressed=true]{background:#000;color:#fff}
.file-label input{position:absolute;width:1px;height:1px;opacity:0}.photo-list{display:grid;gap:0;margin-top:14px}
.photo-card{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:start;border:1px solid #000;padding:10px;margin-bottom:-1px}
.photo-card img{width:54px;height:54px;object-fit:cover}.photo-card small{display:block;margin:0 0 7px;font-size:11px;overflow-wrap:anywhere}
.photo-card input{width:100%;padding:5px;border:1px solid #000;font-size:12px}.tiny{border:0;background:#fff;text-decoration:underline;font-size:12px}
.stage{padding:16px;overflow:auto;height:calc(100vh - 111px);min-height:700px;background:#fff}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.tabs{display:flex}
.tabs button{padding:8px 9px;border:1px solid #000;background:#fff;font-size:12px}.tabs button+button{border-left:0}.tabs button.active{background:#000;color:#fff}
.top-right,.preview-actions{display:flex;align-items:center;gap:8px}[hidden]{display:none!important}.full-view #closePreview{display:none}.scale-note{font-size:11px;text-align:right;line-height:1.4}.paper-wrap{width:738px}.paper{transform-origin:top left;width:738px;min-height:900px;padding:40px 24px;background:#fff;border:1px solid #000;zoom:1}.paper:has(.donga-frame){width:738px}
.page-frame{margin:auto}.article{margin:auto}.article-title,.article-body{overflow-wrap:break-word;word-break:break-all}.article-title{white-space:normal}
.article-category{font-size:15px;font-weight:700;margin-bottom:16px}.article-meta{font-size:12px;padding:0 0 16px;border-bottom:1px solid #000;margin-bottom:26px}
.article-body p{margin:0;white-space:normal}.article-body .section-heading{display:block;font-weight:700}.figure{margin:27px auto 34px;text-align:center}.figure img{display:block;max-width:100%;height:auto;margin:auto}.figure figcaption{font-size:12px;line-height:1.5;margin-top:8px;color:#000}.figure:has(figcaption:empty) figcaption{display:none}
.article.donga{width:684px;font-family:"Donga Article Latin","Donga Article Korean",sans-serif;letter-spacing:-.3px;color:#111}.donga .article-title{width:100%;max-width:676px;font-size:34px;line-height:47.6px;font-weight:700;margin:10px 0 30px;letter-spacing:-.3px;word-break:keep-all;overflow-wrap:break-word}.donga .article-body{width:684px;font-size:18px;font-weight:400;line-height:32.4px;letter-spacing:-.3px;word-break:break-all;overflow-wrap:break-word}.donga .article-body b{font-weight:700}.donga .figure{max-width:684px;margin:0 auto 36px}.donga .figure figcaption{font-size:13px;line-height:1.5;text-align:left;margin-top:14px;opacity:.5}.donga .figure + p{margin-top:0}
.article.naver{width:666px;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Apple SD Gothic Neo",sans-serif;letter-spacing:-.3px}.naver .article-category{font-size:12px}.naver .article-title{font-size:28px;line-height:36px;font-weight:700;letter-spacing:-.3px;margin:0 0 18px;word-break:break-all}.naver .article-body{font-size:17px;line-height:1.56;word-break:break-all}.naver .article-body p:not(:last-child){margin-bottom:26.52px}.naver .figure{max-width:666px;margin:0 0 20.5px}.naver .figure figcaption{font-size:15px;line-height:21px;text-align:center;margin-top:10px}.naver .article-body .figure + p{margin-top:0}
.article-body .figure:first-child{margin-top:0}.article-body p + .figure{margin-top:0}.donga .article-body p:has(+ .figure){margin-bottom:32.4px!important}.naver .article-body p:has(+ .figure){margin-bottom:26.52px!important}
.font-note,.note{font-size:11px;line-height:1.5;margin:14px 0 0}.resize-options{margin-top:12px}.resize-options label{margin:0}.resize-options select{padding:7px;border:1px solid #000;background:#fff}.resize-result{margin-top:14px;border:1px solid #000;padding:14px}.resize-result img{display:block;max-width:100%;max-height:240px;object-fit:contain;margin-bottom:12px;cursor:grab}.resize-result p{font-size:12px;line-height:1.6}.resize-status{font-size:12px;min-height:20px}#bodyText.drop-ready{outline:3px solid #000;outline-offset:2px}.resize-result .add-row{margin-top:12px}
.full-view{overflow:hidden}.full-view .preview-panel{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;border:0;background:#fff}
.full-view .preview-panel .panel-title{flex:none}.full-view .preview-panel .stage{flex:1;height:auto;min-height:0;padding:20px 24px;overflow:auto}
.full-view .preview-panel .paper-wrap{width:100%}.full-view .preview-panel .paper{width:100%;min-width:1312px;min-height:calc(100vh - 155px);padding:0;border:0;zoom:1}
.full-view .preview-panel .paper:has(.naver-frame){min-width:1110px}.full-view .preview-panel .page-frame{width:1312px;padding:35px 16px;margin:0 auto}
.full-view .preview-panel .donga-frame .article{margin:0 auto}.full-view .preview-panel .naver-frame{width:1110px;padding:32px 15px}.full-view .preview-panel .naver-frame .article{margin:0 0 0 36px}
.full-view .preview-panel .note{display:none}
@media(max-width:1540px) and (min-width:901px){.grid{grid-template-columns:minmax(0,55fr) minmax(0,45fr)}}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.preview-panel{border-left:0;border-top:1px solid #000}.stage{height:420px;min-height:420px}.editor-content{padding:24px}#bodyText{min-height:420px}}
@media(max-width:560px){.top{flex-wrap:wrap}.top-right{flex-wrap:wrap}.panel-title{padding:0 12px}.stage{padding:10px}}

.donga .sub_tit:before{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:#111}

.naver .article-body b{font-weight:700}

<body>

$('confirmImage').onclick=async()=>{const brief=$('imageBrief').value.trim();if(brief.length<10){$('imageStatus').textContent='원하는 장면을 조금 더 적어 주세요.';return}if(articleText()!==imageRequestBody){$('imageStatus').textContent='원고가 바뀌었습니다. 창을 닫고 다시 열어 새 원고에 맞는 설명을 확인해 주세요.';return}$('confirmImage').disabled=true;$('generateImage').disabled=true;$('imageBrief').disabled=true;$('imageStatus').textContent='확인한 설명으로 이미지를 만들고 있어요.';try{const data=await api('image',{image_brief:brief,body:imageRequestBody});const p={id:nextPhotoId++,name:'AI 생성 기사 이미지',url:'data:image/png;base64,'+data.image,caption:'',generated:true,brief};photos.push(p);renderPhotoList();$('photoLibrary').open=true;scheduleSave();$('imageStatus').textContent='사진 보관함에 추가했습니다. 원하는 문단으로 끌어 넣으세요.';$('aiState').textContent='새 이미지가 사진 보관함에 있습니다.'}catch(e){$('imageStatus').textContent=e.message}finally{$('confirmImage').disabled=false;$('generateImage').disabled=false;$('imageBrief').disabled=false}};
// Browser-only draft storage. Photos use IndexedDB rather than limited localStorage.
const dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('journalist-workspace',1);req.onupgradeneeded=()=>req.result.createObjectStore('drafts');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
function snapshot(){return {body:bodyString(),markup:bodyMarkup(),photos,nextPhotoId,createdAt,updatedAt,manual,headline:$('headline').value,subheadline:$('subheadline').value,category:$('category').value,autoTitle:$('autoHeadline').checked,autoSubtitle:$('autoSubtitle').checked,fieldMarkup:Object.fromEntries(['headline','subheadline'].map(id=>[id,bodyMarkup($(id))]))}}
function scheduleSave(){clearTimeout(saveTimer);$('saveState').textContent='저장 중';saveTimer=setTimeout(saveDraft,350)}
async function saveDraft(){try{const db=await dbPromise;const t=db.transaction('drafts','readwrite');t.objectStore('drafts').put(snapshot(),'current');t.oncomplete=()=>$('saveState').textContent='이 브라우저에 저장됨';t.onerror=()=>$('saveState').textContent='저장 공간이 부족해 저장하지 못했어요.'}catch{$('saveState').textContent='이 브라우저에서는 자동 저장을 사용할 수 없어요.'}}
async function loadDraft(){try{const db=await dbPromise;const r=db.transaction('drafts').objectStore('drafts').get('current');await new Promise((resolve,reject)=>{r.onerror=()=>reject(r.error);r.onsuccess=()=>{const d=r.result;if(!d){resolve();return}photos=d.photos||[];photos.forEach(p=>{if(p.generated&&p.caption==='기사 내용을 바탕으로 제작한 설명 이미지')p.caption=''});nextPhotoId=d.nextPhotoId||1;createdAt=d.createdAt;updatedAt=d.updatedAt;manual=d.manual||manual;for(const id of ['headline','subheadline','category'])$(id).value=d[id]||'';$('autoHeadline').checked=d.autoTitle??(d.auto!==false&&!manual.headline);$('autoSubtitle').checked=d.autoSubtitle??(d.auto!==false&&!manual.subheadline);if(d.fieldMarkup)for(const id of ['headline','subheadline'])if(d.fieldMarkup[id])setFieldMarkup(id,d.fieldMarkup[id].replace(/\n/g,'<br>'));if(typeof d.markup==='string')restoreMarkup(d.markup);else restoreEditor(d.body||'');lastAIText=articleText();renderPhotoList();render();resolve()}})}catch{}}
$('clearArticle').onclick=()=>{if((articleText()||photos.length||$('headline').value)&&!confirm('현재 원고를 지우고 새 기사를 시작할까요?'))return;generation++;clearTimeout(aiTimer);photos=[];nextPhotoId=1;createdAt=updatedAt=null;manual={headline:false,subheadline:false};lastAIText='';flowBody='';$('flowList').replaceChildren();$('flowAdvice').textContent='';$('headline').value=$('subheadline').value='';restoreEditor('');renderPhotoList();render();scheduleSave();editor.focus()};
function selectPlatform(name){platform=name;$('article').className=`article ${name}`;$('pageFrame').className=`page-frame ${name}-frame`;['donga','naver'].forEach(p=>{$(p+'Tab').classList.toggle('active',name===p);$(p+'Tab').setAttribute('aria-pressed',String(name===p))});render()}
$('dongaTab').onclick=()=>selectPlatform('donga');$('naverTab').onclick=()=>selectPlatform('naver');
function updatePreviewScale(){const paper=document.querySelector('.paper'),wrap=$('paperWrap'),stage=document.querySelector('.stage');const style=getComputedStyle(stage);const available=stage.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);const factor=Math.min(1,Math.max(.01,available/paper.offsetWidth));paper.style.transform=`scale(${factor})`;wrap.style.width=paper.offsetWidth*factor+'px';wrap.style.height=Math.ceil(paper.offsetHeight*factor)+'px';$('scaleNote').textContent='홈페이지 기사 비율 기준'}

function setPreviewOpen(open){document.body.classList.toggle('preview-hidden',!open);$('openPreview').hidden=open;requestAnimationFrame(updatePreviewScale)}
$('closePreview').onclick=()=>setPreviewOpen(false);$('openPreview').onclick=()=>setPreviewOpen(true);$('fullReview').onclick=()=>{const active=document.body.classList.toggle('full-view');$('fullReview').textContent=active?'글 쓰기로 돌아가기':'크게 보기';$('fullReview').setAttribute('aria-pressed',String(active));updatePreviewScale()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('flowPanel').hidden)toggleFlow(false);if(e.key==='Escape'&&document.body.classList.contains('full-view'))$('fullReview').click()});window.addEventListener('resize',updatePreviewScale);const previewObserver=new ResizeObserver(updatePreviewScale);previewObserver.observe(document.querySelector('.paper'));previewObserver.observe(document.querySelector('.stage'));
Promise.all([document.fonts.load('400 18px "Donga Article Korean"','기사 본문'),document.fonts.load('700 34px "Donga Article Korean"','기사 제목'),document.fonts.load('400 18px "Donga Article Latin"','ABC 123'),document.fonts.load('700 34px "Donga Article Latin"','ABC 123')]).then(updatePreviewScale).catch(()=>{$('aiState').textContent='글꼴을 불러오지 못했습니다. 새로고침해 주세요.'});
async function connect(){try{if(location.protocol==='file:')throw Error();const r=await fetch('/api/status');const d=await r.json();apiReady=d.ready;$('aiState').textContent=apiReady?'본문 작성 후 제목·부제목이 자동 생성됩니다.':'AI 연결 전 · 서버에 API 키를 설정해 주세요.';scheduleAI()}catch{$('aiState').textContent='미리보기 사용 가능 · AI 기능은 동봉한 서버로 실행해 주세요.'}}
render();loadDraft().then(connect);

let formatRange=null,formatRoot=null;const formatTools=$('selectionTools');
function updateSelectionTools(){const sel=window.getSelection();const anchor=sel.anchorNode?.nodeType===1?sel.anchorNode:sel.anchorNode?.parentElement;const root=anchor?.closest('[contenteditable="true"]');if(!sel.rangeCount||sel.isCollapsed||!root||!root.contains(sel.focusNode)||anchor.closest('figure')){formatTools.hidden=true;return}formatRoot=root;formatRange=sel.getRangeAt(0).cloneRange();const host=root.closest('dialog')||document.body;if(formatTools.parentNode!==host)host.append(formatTools);const rect=formatRange.getBoundingClientRect();if(rect.bottom<0||rect.top>innerHeight){formatTools.hidden=true;return}formatTools.hidden=false;formatTools.style.left=Math.max(8,Math.min(innerWidth-formatTools.offsetWidth-8,rect.left+rect.width/2-formatTools.offsetWidth/2))+'px';formatTools.style.top=Math.max(8,Math.min(innerHeight-formatTools.offsetHeight-8,rect.top-formatTools.offsetHeight-8))+'px';$('sectionHeadingTool').hidden=root!==editor;formatTools.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.command==='sectionHeading'?/^\s*●/.test(sel.toString()):document.queryCommandState(b.dataset.command))))}
formatTools.addEventListener('mousedown',e=>e.preventDefault());
formatTools.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!formatRange||!formatRoot?.contains(formatRange.commonAncestorContainer))return;formatRoot.focus();const sel=window.getSelection();sel.removeAllRanges();sel.addRange(formatRange);document.execCommand('styleWithCSS',false,false);if(b.dataset.command==='sectionHeading')applySectionHeading();else document.execCommand(b.dataset.command,false,null);formatRange=sel.getRangeAt(0).cloneRange();formatRoot.dispatchEvent(new Event('input',{bubbles:true}));updateSelectionTools()});
document.addEventListener('selectionchange',updateSelectionTools);document.addEventListener('scroll',updateSelectionTools,true);window.addEventListener('resize',updateSelectionTools);document.addEventListener('keydown',e=>{if(e.key==='Escape')formatTools.hidden=true});
new ResizeObserver(()=>{if(!flow.hidden){const r=flow.getBoundingClientRect();placeFlow(r.left,r.top)}}).observe(flow);

function applySectionHeading(){
 const sel=window.getSelection();if(formatRoot!==editor||!sel.rangeCount)return;
 const range=sel.getRangeAt(0);if([...editor.querySelectorAll('figure')].some(f=>range.intersectsNode(f)))return;
 const text=sel.toString().trim();if(!text)return;
 const isHeading=/^●\s*/.test(text),clean=text.replace(/^●\s*/,'');
 const before=document.createRange();before.selectNodeContents(editor);before.setEnd(range.startContainer,range.startOffset);
 const after=document.createRange();after.selectNodeContents(editor);after.setStart(range.endContainer,range.endOffset);
 const prefix=before.toString().trim()?' <br><br>':'';const suffix=after.toString().trim()?'<br><br>':'';
 const content=isHeading?escapeText(clean):'<b>● '+escapeText(clean).replace(/\n+/g,' ')+'</b>';
 document.execCommand('insertHTML',false,isHeading?content:prefix+content+suffix);
}
let photoScrollFrame=null,photoScrollPoint=null,photoScrollLast=0;
function stopPhotoScroll(){if(photoScrollFrame!==null)cancelAnimationFrame(photoScrollFrame);photoScrollFrame=null;photoScrollPoint=null;photoScrollLast=0}
function photoScrollSpeed(y,top,bottom){const edge=Math.min(100,(bottom-top)/3);if(y<top+edge)return -18*Math.min(1,Math.max(0,(top+edge-y)/edge));if(y>bottom-edge)return 18*Math.min(1,Math.max(0,(y-bottom+edge)/edge));return 0}
function runPhotoScroll(now){photoScrollFrame=null;if(!photoScrollPoint)return;const {x,y}=photoScrollPoint;const bounds=editor.getBoundingClientRect();if(x<bounds.left||x>bounds.right){stopPhotoScroll();return}
 let scrollNode=editor.parentElement;while(scrollNode&&scrollNode!==document.body){const css=getComputedStyle(scrollNode);if(/auto|scroll/.test(css.overflowY)&&scrollNode.scrollHeight>scrollNode.clientHeight)break;scrollNode=scrollNode.parentElement}
 const nested=scrollNode&&scrollNode!==document.body;const rect=nested?scrollNode.getBoundingClientRect():{top:0,bottom:innerHeight};const speed=photoScrollSpeed(y,Math.max(0,rect.top),Math.min(innerHeight,rect.bottom));const elapsed=photoScrollLast?Math.min(32,now-photoScrollLast):16;photoScrollLast=now;
 if(speed){if(nested)scrollNode.scrollTop+=speed*elapsed/16;else window.scrollBy(0,speed*elapsed/16);showDropPreview({clientY:y})}
 photoScrollFrame=requestAnimationFrame(runPhotoScroll);
}
document.addEventListener('dragover',e=>{if(!e.dataTransfer.types.includes('application/x-article-photo')&&!e.dataTransfer.types.includes('Files'))return;const r=editor.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right){stopPhotoScroll();return}photoScrollPoint={x:e.clientX,y:e.clientY};if(photoScrollFrame===null)photoScrollFrame=requestAnimationFrame(runPhotoScroll)});
document.addEventListener('drop',stopPhotoScroll);document.addEventListener('dragend',stopPhotoScroll);document.addEventListener('dragleave',e=>{if(!e.relatedTarget)stopPhotoScroll()});window.addEventListener('blur',stopPhotoScroll);
